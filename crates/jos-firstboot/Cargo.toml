[package]
name = "jos-firstboot"
description = "JuanitOS first-boot setup: a QubesOS-style wizard on the vt(4) framebuffer that creates sys-net, sys-firewall and the app qubes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "jos-firstboot"
path = "src/main.rs"

[dependencies]
juanitos-core = { path = "../juanitos-core" }
jos-fb = { path = "../jos-fb" }
jos-gfx = { path = "../jos-gfx", features = ["png"] }
anyhow.workspace = true
clap.workspace = true

[lints]
workspace = true
