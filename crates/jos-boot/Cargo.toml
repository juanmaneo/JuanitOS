[package]
name = "jos-boot"
description = "JuanitOS graphical pre-loader: a UEFI application that shows the boot card, offers a small menu and chain-loads FreeBSD's loader.efi"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/juanmaneo/JuanitOS"

# Standalone workspace: this crate builds for x86_64-unknown-uefi (see
# .cargo/config.toml) and must not be pulled into the host workspace. The
# pure logic in src/lib.rs is tested on the host with
#   cargo test --lib --target x86_64-unknown-linux-gnu
[workspace]

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "jos-boot"
path = "src/main.rs"
# A no_std/no_main binary has nothing to test and its panic handler
# clashes with the test harness.
test = false
bench = false

[dependencies]
jos-gfx = { path = "../jos-gfx" }
# uefi's own GUID type, used by the pure logic in lib.rs (which must not
# link uefi: its global allocator would replace the host test allocator).
uguid = "2.2"
uefi = { version = "0.41", default-features = false, features = ["alloc", "global_allocator"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
