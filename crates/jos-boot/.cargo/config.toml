# SPDX-License-Identifier: BSD-3-Clause
[build]
target = "x86_64-unknown-uefi"

# Never let Cargo hand a UEFI PE binary to the host's binfmt/Wine handler.
# The pure library tests must use the host target; firmware execution uses QEMU.
[target.x86_64-unknown-uefi]
runner = ["sh", "-c", "echo 'UEFI binaries cannot run directly; use cargo test --lib --target x86_64-unknown-linux-gnu for host tests or tools/uefi-test.sh for firmware tests.' >&2; exit 1"]
