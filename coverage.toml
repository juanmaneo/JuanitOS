# Coverage allowances checked by `cargo xtask coverage`.
#
# The target is 100 % of lines, functions and regions in every file.
# Each entry below says how many of them a file may still leave
# uncovered; a file that is not listed must be fully covered.
# Counts are exact: coverage has to be deterministic.
# `cargo xtask coverage --ratchet` lowers the allowances to the
# measured values and drops files that reach zero (never raises).
# Commit the updated file together with the tests that earned it.
