# Everything is in `cargo xtask ci` (xtask/src/main.rs), so CI and a
# developer's machine run exactly the same checks.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: 300
  RUST_BACKTRACE: 1

jobs:
  ci:
    # Pinned: the coverage floors depend on which host tools the image has.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml selects the toolchain, its components and the
      # UEFI/FreeBSD targets; `rustup show` installs them.
      - run: rustup show && rustup component add llvm-tools-preview
      # Cargo subcommands `cargo xtask ci` needs (prebuilt binaries):
      # coverage, then the security audit (RustSec + deny.toml).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-audit,cargo-deny
      # Host tools the checks need. mtools: jos-release tests write into
      # a disk image's ESP (disk.rs; tar and mkfifo come with the image).
      # clang-format and clang-tidy: the LLVM major version in
      # .clang-version, from LLVM's apt repository (Ubuntu's packages lag
      # behind); `cargo xtask fmt` and `lint` refuse any other version.
      - run: |
          llvm=$(cat .clang-version)
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$llvm main" | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y mtools clang-format-$llvm clang-tidy-$llvm
          sudo ln -sf /usr/bin/clang-format-$llvm /usr/local/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-$llvm /usr/local/bin/clang-tidy
      # The FreeBSD kernel headers clang-tidy compiles against: `cargo
      # xtask lint` fetches src.txz (250 MB) once per release and keeps
      # the header directories here.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/juanitos
          key: juanitos-cache-${{ hashFiles('release/juanitos.toml', 'xtask/src/clang.rs') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/jos-boot
            crates/jos-firewall
      - run: cargo xtask ci
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lcov
          path: target/coverage/lcov.info
