# Everything is in `cargo xtask ci` (xtask/src/main.rs), so CI and a
# developer's machine run exactly the same checks.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: 300
  RUST_BACKTRACE: 1

jobs:
  ci:
    # Pinned: the coverage floors depend on which host tools the image has.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml selects the toolchain, its components and the
      # UEFI/FreeBSD targets; `rustup show` installs them.
      - run: rustup show && rustup component add llvm-tools-preview
      # Cargo subcommands `cargo xtask ci` needs (prebuilt binaries):
      # coverage, then the security audit (RustSec + deny.toml).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-audit,cargo-deny
      # Host tools some tests need; without them they skip and coverage
      # drops below the floors. OVMF: jos-release QEMU tests; mtools:
      # writing into a disk image's ESP (jos-release disk.rs).
      - run: sudo apt-get update && sudo apt-get install -y ovmf mtools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/jos-boot
            crates/jos-firewall
      - run: cargo xtask ci
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lcov
          path: target/coverage/lcov.info
