# JuanitOS release profile, read by `jos-release`.
#
# The dom0 is a stock FreeBSD release plus packages plus the JuanitOS
# binaries; nothing is compiled from the FreeBSD source tree. See
# docs/bootstrap.md for the stage-1 (on FreeBSD) and stage-2 (on JuanitOS)
# builds.

# Image version stamped into the ISO name and /usr/local/share/juanitos/release.toml
version = "0.1.0"

# FreeBSD release the dom0 is built from.
freebsd_version = "15.1-RELEASE"
arch = "amd64"
mirror = "https://download.freebsd.org/releases"

# Distribution sets taken from the FreeBSD release (verified against its MANIFEST).
dists = ["base.txz", "kernel.txz"]

# ISO9660 volume label; the live /etc/fstab refers to /dev/iso9660/<label>.
label = "JUANITOS"

# Also make the ISO bootable on legacy BIOS when boot/cdboot exists.
bios = true

[packages]
# Install the COSMIC desktop (best effort: a component that did not build
# is skipped) and the ly login screen.
gui = true
# Install rust + git so the installed system can rebuild JuanitOS (stage 2).
selfhost = true
# Anything else you want in every dom0.
extra = ["tmux", "vim"]
# FreeBSD package branch: "quarterly" or "latest". The COSMIC packages are
# built against it (tools/dev/cosmic-build.sh in the build VM) and their
# shared libraries must match what the dom0 installs.
repo = "latest"
# pkg repository with the COSMIC packages (output of `cosmic-build.sh repo`,
# copied from the build VM), relative to this source tree. Shipped in the
# dom0 at /usr/local/share/juanitos/pkg.
local_repo = "target/work/cosmic/repo"

[source]
# Copy this repository into /usr/local/src/juanitos and vendor its crates so
# stage 2 can build offline.
include = true
vendor = true

[grub]
# GRUB release whose headers build freebsd/grub/jos_efi.mod, the module
# Ventoy's GRUB (based on this release) loads for the stick's direct kernel
# boot. Only the tarball's include/ directory is used.
version = "2.04"
url = "https://ftp.gnu.org/gnu/grub/grub-2.04.tar.xz"
sha256 = "e5292496995ad42dabe843a0192cf2a2c502e7ffcc7479398232b10a472df77d"

[drm_kmod]
# drm-kmod tag the dom0's drm-kmod package (drm-612-kmod) is built from;
# freebsd/jos_vmsvga is built against the same LinuxKPI/DRM headers.
version = "drm_v6.12.110_1"
url = "https://github.com/freebsd/drm-kmod/archive/refs/tags/drm_v6.12.110_1.tar.gz"
sha256 = "9c99c05c3269271ca6ea19ccdca53b27517b1d6b679065fc5c3dfc2682ddfaef"
